name: Publish QShop Requester

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        type: string
      neoforge_ref:
        description: NeoForge branch or tag to build
        required: false
        default: neoforge-1.21.1
        type: string
      loader:
        description: Platform to publish for a manual run
        required: false
        default: all
        type: choice
        options:
          - all
          - forge
          - neoforge

permissions:
  contents: write

concurrency:
  group: curseforge-requester-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  NEOFORGE_REF: ${{ inputs.neoforge_ref || 'neoforge-1.21.1' }}

jobs:
  publish-forge:
    if: ${{ github.event_name == 'release' || inputs.loader == 'all' || inputs.loader == 'forge' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out Requester Forge source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          path: Q-shop-requester-forge-1.20.1

      - name: Check out QShop Forge dependency
        uses: actions/checkout@v4
        with:
          repository: QLNPLUS/Q-shop
          ref: master
          path: Q-shop

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local build settings
        run: |
          ln -s Q-shop Q-shop-forge-1.20.1
          sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' \
            Q-shop/gradle.properties \
            Q-shop-requester-forge-1.20.1/gradle.properties

      - name: Prepare Forge release version
        id: prepare-forge-version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          echo "CURSEFORGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || {
            echo "Missing repository variable CURSEFORGE_PROJECT_ID"
            exit 1
          }
          test -n "$CURSEFORGE_TOKEN" || {
            echo "Missing repository secret CURSEFORGE_TOKEN"
            exit 1
          }

      - name: Build QShop Forge dependency
        run: |
          chmod +x Q-shop/gradlew
          (cd Q-shop && ./gradlew build --no-daemon)

      - name: Build Requester Forge mod
        run: |
          chmod +x Q-shop-requester-forge-1.20.1/gradlew
          (cd Q-shop-requester-forge-1.20.1 && ./gradlew build --no-daemon)

      - name: Verify Forge release artifact
        id: verify-forge-artifact
        working-directory: Q-shop-requester-forge-1.20.1
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          artifact="build/libs/qshop-requester-forge-1.20.1-${version}.jar"
          test -f "$artifact" || {
            echo "Missing expected Forge artifact: $artifact"
            find build/libs -maxdepth 1 -type f -name '*.jar' -print
            exit 1
          }
          echo "path=Q-shop-requester-forge-1.20.1/$artifact" >> "$GITHUB_OUTPUT"
          echo "name=qshop-requester-forge-1.20.1-${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare current Forge changelog
        working-directory: Q-shop-requester-forge-1.20.1
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\]$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md || {
            echo "Missing CHANGELOG.md section for version $version"
            exit 1
          }

      - name: Publish Requester Forge mod file
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_VERSION }}
          files: ${{ steps.verify-forge-artifact.outputs.path }}
          version: ${{ steps.prepare-forge-version.outputs.version }}
          name: ${{ steps.verify-forge-artifact.outputs.name }}
          version-type: release
          changelog-file: Q-shop-requester-forge-1.20.1/build/curseforge-changelog.md
          loaders: forge
          game-versions: 1.20.1
          java: 17

  publish-neoforge:
    if: ${{ github.event_name == 'release' || inputs.loader == 'all' || inputs.loader == 'neoforge' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out Requester NeoForge source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEOFORGE_REF }}
          path: Q-shop-requester-neoforge-1.21.1

      - name: Check out QShop NeoForge dependency
        uses: actions/checkout@v4
        with:
          repository: QLNPLUS/Q-shop
          ref: neoforge-1.21.1
          path: Q-shop-neoforge-1.21.1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local build settings
        run: |
          sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' \
            Q-shop-neoforge-1.21.1/gradle.properties \
            Q-shop-requester-neoforge-1.21.1/gradle.properties

      - name: Prepare NeoForge release version
        id: prepare-neoforge-version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          echo "CURSEFORGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || {
            echo "Missing repository variable CURSEFORGE_PROJECT_ID"
            exit 1
          }
          test -n "$CURSEFORGE_TOKEN" || {
            echo "Missing repository secret CURSEFORGE_TOKEN"
            exit 1
          }

      - name: Build QShop NeoForge dependency
        run: |
          chmod +x Q-shop-neoforge-1.21.1/gradlew
          (cd Q-shop-neoforge-1.21.1 && ./gradlew build --no-daemon)

      - name: Build Requester NeoForge mod
        run: |
          chmod +x Q-shop-requester-neoforge-1.21.1/gradlew
          (cd Q-shop-requester-neoforge-1.21.1 && ./gradlew build --no-daemon)

      - name: Verify NeoForge release artifact
        id: verify-neoforge-artifact
        working-directory: Q-shop-requester-neoforge-1.21.1
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          artifact="build/libs/qshop-requester-neoforge-1.21.1-${version}.jar"
          test -f "$artifact" || {
            echo "Missing expected NeoForge artifact: $artifact"
            find build/libs -maxdepth 1 -type f -name '*.jar' -print
            exit 1
          }
          echo "path=Q-shop-requester-neoforge-1.21.1/$artifact" >> "$GITHUB_OUTPUT"
          echo "name=qshop-requester-neoforge-1.21.1-${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare current NeoForge changelog
        working-directory: Q-shop-requester-neoforge-1.21.1
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\]$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md || {
            echo "Missing CHANGELOG.md section for version $version"
            exit 1
          }

      - name: Publish Requester NeoForge mod file
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_VERSION }}
          files: ${{ steps.verify-neoforge-artifact.outputs.path }}
          version: ${{ steps.prepare-neoforge-version.outputs.version }}
          name: ${{ steps.verify-neoforge-artifact.outputs.name }}
          version-type: release
          changelog-file: Q-shop-requester-neoforge-1.21.1/build/curseforge-changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
