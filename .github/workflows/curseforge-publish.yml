name: Publish QShop Requester NeoForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: curseforge-requester-neoforge-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Requester NeoForge source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          path: Q-shop-requester-neoforge-1.26.1.2

      - name: Check out QShop NeoForge dependency
        uses: actions/checkout@v4
        with:
          repository: QLNPLUS/Q-shop
          ref: neoforge-1.26.1.2
          path: Q-shop-neoforge-1.26.1.2

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local build settings
        run: |
          sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' \
            Q-shop-neoforge-1.26.1.2/gradle.properties \
            Q-shop-requester-neoforge-1.26.1.2/gradle.properties

      - name: Prepare NeoForge release version
        id: prepare-neoforge-version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-(forge|neoforge)-.*)?$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Unsupported release tag: $RELEASE_VERSION"
            exit 1
          fi
          echo "CURSEFORGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || {
            echo "Missing repository variable CURSEFORGE_PROJECT_ID"
            exit 1
          }
          test -n "$CURSEFORGE_TOKEN" || {
            echo "Missing repository secret CURSEFORGE_TOKEN"
            exit 1
          }

      - name: Build QShop NeoForge dependency
        run: |
          chmod +x Q-shop-neoforge-1.26.1.2/gradlew
          (cd Q-shop-neoforge-1.26.1.2 && ./gradlew build --no-daemon)

      - name: Build Requester NeoForge mod
        run: |
          qshop_version="$(sed -n 's/^mod_version=//p' Q-shop-neoforge-1.26.1.2/gradle.properties)"
          chmod +x Q-shop-requester-neoforge-1.26.1.2/gradlew
          (cd Q-shop-requester-neoforge-1.26.1.2 && ./gradlew -PqshopJar="../Q-shop-neoforge-1.26.1.2/build/libs/qshop-neoforge-26.1.2-${qshop_version}.jar" build --no-daemon)

      - name: Verify NeoForge release artifact
        id: verify-neoforge-artifact
        working-directory: Q-shop-requester-neoforge-1.26.1.2
        env:
          CURSEFORGE_VERSION: ${{ steps.prepare-neoforge-version.outputs.version }}
        run: |
          artifact="build/libs/qshop-requester-neoforge-26.1.2-${CURSEFORGE_VERSION}.jar"
          test -f "$artifact" || {
            echo "Missing expected NeoForge artifact: $artifact"
            find build/libs -maxdepth 1 -type f -name '*.jar' -print
            exit 1
          }
          echo "path=Q-shop-requester-neoforge-1.26.1.2/$artifact" >> "$GITHUB_OUTPUT"
          echo "name=qshop-requester-neoforge-26.1.2-${CURSEFORGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare current NeoForge changelog
        working-directory: Q-shop-requester-neoforge-1.26.1.2
        env:
          CURSEFORGE_VERSION: ${{ steps.prepare-neoforge-version.outputs.version }}
        run: |
          version="$CURSEFORGE_VERSION"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\]$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md || {
            echo "Missing CHANGELOG.md section for version $version"
            exit 1
          }

      - name: Publish Requester NeoForge mod file
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_VERSION }}
          files: ${{ steps.verify-neoforge-artifact.outputs.path }}
          version: ${{ steps.prepare-neoforge-version.outputs.version }}
          name: ${{ steps.verify-neoforge-artifact.outputs.name }}
          version-type: release
          changelog-file: Q-shop-requester-neoforge-1.26.1.2/build/curseforge-changelog.md
          loaders: neoforge
          game-versions: 26.1.2
          java: 25
