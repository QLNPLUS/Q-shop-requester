name: Publish QShop Requester

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        type: string
      platform:
        description: Platform to build and publish
        required: true
        type: choice
        options:
          - forge-1.20.1
          - neoforge-1.21.1
          - neoforge-26.1.2

permissions:
  contents: write

concurrency:
  group: curseforge-requester-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  publish:
    if: ${{ (github.event_name == 'release' && endsWith(github.event.release.tag_name, matrix.tag_suffix)) || (github.event_name == 'workflow_dispatch' && inputs.platform == matrix.platform) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: forge-1.20.1
            tag_suffix: forge-1.20.1
            loader: forge
            game_version: 1.20.1
            java_version: '17'
            requester_dir: Q-shop-requester-forge-1.20.1
            qshop_dir: Q-shop
            qshop_ref: master
            qshop_artifact: qshop-forge-1.20.1-1.6.2.jar
            artifact_prefix: qshop-requester-forge-1.20.1
          - platform: neoforge-1.21.1
            tag_suffix: neoforge-1.21.1
            loader: neoforge
            game_version: 1.21.1
            java_version: '21'
            requester_dir: Q-shop-requester-neoforge-1.21.1
            qshop_dir: Q-shop-neoforge-1.21.1
            qshop_ref: neoforge-1.21.1
            qshop_artifact: qshop-neoforge-1.21.1-1.6.2.jar
            artifact_prefix: qshop-requester-neoforge-1.21.1
          - platform: neoforge-26.1.2
            tag_suffix: neoforge-1.26.1.2
            loader: neoforge
            game_version: 26.1.2
            java_version: '25'
            requester_dir: Q-shop-requester-neoforge-1.26.1.2
            qshop_dir: Q-shop-neoforge-1.26.1.2
            qshop_ref: neoforge-1.26.1.2
            qshop_artifact: qshop-neoforge-26.1.2-1.6.2.jar
            artifact_prefix: qshop-requester-neoforge-26.1.2

    steps:
      - name: Check out Requester source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          path: ${{ matrix.requester_dir }}

      - name: Check out QShop dependency
        uses: actions/checkout@v4
        with:
          repository: QLNPLUS/Q-shop
          ref: ${{ matrix.qshop_ref }}
          path: ${{ matrix.qshop_dir }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build directories and remove local settings
        env:
          PLATFORM: ${{ matrix.platform }}
          QSHOP_DIR: ${{ matrix.qshop_dir }}
          REQUESTER_DIR: ${{ matrix.requester_dir }}
        run: |
          if [[ "$PLATFORM" == "forge-1.20.1" ]]; then
            ln -s "$QSHOP_DIR" Q-shop-forge-1.20.1
          fi
          sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' \
            "$QSHOP_DIR/gradle.properties" \
            "$REQUESTER_DIR/gradle.properties"

      - name: Prepare release version
        id: prepare-version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
        run: |
          version="${RELEASE_TAG#v}"
          suffix="-$TAG_SUFFIX"
          case "$version" in
            *"$suffix") version="${version%"$suffix"}" ;;
            *) echo "Release tag does not match platform: $RELEASE_TAG"; exit 1 ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG"
            exit 1
          fi
          echo "CURSEFORGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || {
            echo "Missing repository variable CURSEFORGE_PROJECT_ID"
            exit 1
          }
          test -n "$CURSEFORGE_TOKEN" || {
            echo "Missing repository secret CURSEFORGE_TOKEN"
            exit 1
          }

      - name: Build QShop dependency
        env:
          QSHOP_DIR: ${{ matrix.qshop_dir }}
        run: |
          chmod +x "$QSHOP_DIR/gradlew"
          (cd "$QSHOP_DIR" && ./gradlew build --no-daemon)

      - name: Build Requester mod
        env:
          PLATFORM: ${{ matrix.platform }}
          QSHOP_DIR: ${{ matrix.qshop_dir }}
          QSHOP_ARTIFACT: ${{ matrix.qshop_artifact }}
          REQUESTER_DIR: ${{ matrix.requester_dir }}
        run: |
          chmod +x "$REQUESTER_DIR/gradlew"
          if [[ "$PLATFORM" == "neoforge-26.1.2" ]]; then
            (cd "$REQUESTER_DIR" && ./gradlew "-PqshopJar=../$QSHOP_DIR/build/libs/$QSHOP_ARTIFACT" build --no-daemon)
          else
            (cd "$REQUESTER_DIR" && ./gradlew build --no-daemon)
          fi

      - name: Verify release artifact
        id: verify-artifact
        env:
          CURSEFORGE_VERSION: ${{ steps.prepare-version.outputs.version }}
          REQUESTER_DIR: ${{ matrix.requester_dir }}
          ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
        run: |
          artifact="build/libs/${ARTIFACT_PREFIX}-${CURSEFORGE_VERSION}.jar"
          test -f "$REQUESTER_DIR/$artifact" || {
            echo "Missing expected artifact: $REQUESTER_DIR/$artifact"
            find "$REQUESTER_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' -print
            exit 1
          }
          echo "path=$REQUESTER_DIR/$artifact" >> "$GITHUB_OUTPUT"
          echo "name=${ARTIFACT_PREFIX}-${CURSEFORGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare current changelog
        working-directory: ${{ matrix.requester_dir }}
        env:
          CURSEFORGE_VERSION: ${{ steps.prepare-version.outputs.version }}
        run: |
          python - "$CURSEFORGE_VERSION" <<PY
          from pathlib import Path
          import sys

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines) if line.startswith(f"## [{version}]")), None)
          if start is None:
              raise SystemExit(f"Missing CHANGELOG.md section for version {version}")
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")), len(lines))
          Path("build/curseforge-changelog.md").write_text("".join(lines[start:end]), encoding="utf-8")
          PY
          test -s build/curseforge-changelog.md

      - name: Publish Requester mod file
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_TAG }}
          files: ${{ steps.verify-artifact.outputs.path }}
          version: ${{ steps.prepare-version.outputs.version }}
          name: ${{ steps.verify-artifact.outputs.name }}
          version-type: release
          changelog-file: ${{ matrix.requester_dir }}/build/curseforge-changelog.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.game_version }}
          java: ${{ matrix.java_version }}
