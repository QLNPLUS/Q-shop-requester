plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id
base { archivesName = 'qshop-requester-neoforge-26.1.2' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.1.2.107'
    runs {
        client { client() }
        server { server() }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases/' }
}

dependencies {
    def qshopJar = findProperty('qshopJar') != null
            ? file(findProperty('qshopJar').toString())
            : fileTree('../Q-shop-neoforge-1.26.1.2/build/libs') {
                include 'qshop-neoforge-26.1.2-*.jar'
            }.files
            .with { jars ->
                if (jars.size() != 1) {
                    throw new GradleException(
                            "Expected exactly one QShop 26.1.2 jar in ../Q-shop-neoforge-1.26.1.2/build/libs, found: $jars")
                }
                jars.iterator().next()
            }
    if (!qshopJar.isFile()) {
        throw new GradleException("QShop dependency jar does not exist: $qshopJar")
    }
    compileOnly files(qshopJar)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.properties([
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
    ])
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                mod_license: mod_license
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}
